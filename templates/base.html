<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Onlylovablefans{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            boxShadow: {
              soft: "0 10px 30px rgba(2, 6, 23, 0.08)",
              glow: "0 0 0 1px rgba(255,255,255,0.06), 0 30px 90px rgba(0,0,0,0.55)",
            },
            colors: {
              emeraldBrand: "#10B981",
              goldBrand: "#F59E0B",
              charcoal: {
                950: "#0b0f14",
                900: "#0f1720",
                850: "#111b25",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg0: #0b0f14;
        --bg1: #0f1720;
        --card: rgba(255, 255, 255, 0.06);
        --card2: rgba(255, 255, 255, 0.03);
        --stroke: rgba(255, 255, 255, 0.10);
        --stroke2: rgba(255, 255, 255, 0.08);
        --textDim: rgba(255, 255, 255, 0.64);
      }

      .saas-card {
        background: linear-gradient(180deg, var(--card), var(--card2));
        border: 1px solid var(--stroke);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 40px 120px rgba(0, 0, 0, 0.60);
        backdrop-filter: blur(12px);
      }

      .saas-input {
        background-color: rgba(15, 23, 32, 0.55);
        border: 1px solid var(--stroke2);
        color: rgba(255, 255, 255, 0.92);
      }
      .saas-input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
        border-color: rgba(16, 185, 129, 0.45);
      }
      select.saas-input option {
        background-color: rgba(15, 23, 32, 0.98);
        color: rgba(255, 255, 255, 0.92);
      }
      input.saas-input[readonly] {
        background-color: rgba(255, 255, 255, 0.03);
        color: rgba(255, 255, 255, 0.78);
      }

      .saas-btn {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.92), rgba(16, 185, 129, 0.70));
        box-shadow: 0 12px 40px rgba(16, 185, 129, 0.18);
      }
      .saas-btn:hover { filter: brightness(1.06); }
      .saas-btn:active { transform: translateY(1px); }

      .saas-badge {
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(255, 255, 255, 0.04);
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.10) 37%, rgba(255,255,255,0.05) 63%);
        background-size: 400% 100%;
        animation: shimmer 1.4s ease infinite;
      }

      @keyframes pulseRing {
        0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.38); }
        70% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0.00); }
        100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.00); }
      }
      .pulse-gold { animation: pulseRing 1.7s ease-out infinite; }
    </style>
  </head>
  <body class="min-h-screen font-sans text-slate-900">
    <div class="fixed inset-0 -z-10">
      <div class="absolute inset-0 bg-gradient-to-b from-charcoal-950 via-charcoal-900 to-charcoal-850"></div>
      <div class="absolute inset-0 opacity-[0.28] [background-image:radial-gradient(rgba(255,255,255,0.11)_1px,transparent_1px)] [background-size:24px_24px]"></div>
      <div class="absolute -top-24 left-1/2 h-80 w-[52rem] -translate-x-1/2 rounded-full bg-emerald-500/12 blur-3xl"></div>
      <div class="absolute top-56 right-12 h-72 w-72 rounded-full bg-amber-400/10 blur-3xl"></div>
      <div class="absolute bottom-0 left-0 h-80 w-80 rounded-full bg-emerald-400/6 blur-3xl"></div>
    </div>

    <div class="mx-auto max-w-[720px] px-4 py-10">
      <header class="mb-8 flex items-center justify-between">
        <a href="/" class="group inline-flex items-center gap-3">
          <span class="relative grid h-10 w-10 place-items-center rounded-2xl bg-white/5 ring-1 ring-white/10">
            <span class="absolute -inset-1 rounded-[18px] bg-gradient-to-tr from-emerald-400/25 to-amber-400/20 blur-md"></span>
            <span class="relative text-lg leading-none text-emeraldBrand">♥</span>
          </span>
          <div class="leading-tight">
            <div class="text-sm font-semibold text-white">
              <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-amber-300">OnlyLovableFans</span>
            </div>
            <div class="text-xs text-white/50">Pay-per-view unlock platform</div>
          </div>
        </a>
        <div class="flex items-center gap-2">
          <a href="/admin/" class="saas-badge inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold text-white/75 hover:text-white">
            <span class="h-1.5 w-1.5 rounded-full bg-emeraldBrand"></span>
            Admin
          </a>
        </div>
      </header>

      <main class="min-h-[60vh]">
        {% block content %}{% endblock %}
      </main>

      <footer class="mt-8">
        <div class="flex flex-wrap justify-center gap-3 text-xs text-white/55">
          <span class="saas-badge inline-flex items-center gap-2 rounded-full px-3 py-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M7 11V8a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 11h10v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            Link-based access
          </span>
          <span class="saas-badge inline-flex items-center gap-2 rounded-full px-3 py-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 8v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2"/></svg>
            24-hour expiry
          </span>
          <span class="saas-badge inline-flex items-center gap-2 rounded-full px-3 py-1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 13a5 5 0 1 0-5-5 5 5 0 0 0 5 5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            No login needed
          </span>
        </div>
      </footer>
    </div>
  </body>
</html>
