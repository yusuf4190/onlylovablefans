{% extends "base.html" %}
{% block title %}Admin Setup{% endblock %}
{% block content %}
<div class="saas-card rounded-2xl p-8 max-w-sm mx-auto mt-16">
  <h1 class="text-white font-semibold text-lg mb-1">Create Admin Account</h1>
  <p class="text-white/50 text-sm mb-6">One-time setup. This page disables once an admin exists.</p>

  {% if error %}
    <p class="mb-4 rounded-lg bg-red-500/10 border border-red-500/20 px-4 py-2 text-sm text-red-400">{{ error }}</p>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs text-white/60 mb-1">Username</label>
      <input name="username" type="text" required autofocus
        class="saas-input w-full rounded-lg px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs text-white/60 mb-1">Password</label>
      <input name="password" type="password" required
        class="saas-input w-full rounded-lg px-3 py-2 text-sm" />
    </div>
    <button type="submit" class="saas-btn w-full rounded-lg py-2 text-sm font-semibold text-white">
      Create superuser
    </button>
  </form>
</div>
{% endblock %}
